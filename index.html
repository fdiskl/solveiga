<!doctype html>
<html lang="lv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Solveiga | Sociālais Vēstnesis</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="#" aria-label="Sākums">
                    <span class="brand-mark">S</span>
                    <span>
                        <span class="brand-name">Sociālais Vēstnesis</span>
                        <small class="brand-motto"
                            >Mūsdienu dzīves žurnāls</small
                        >
                    </span>
                </a>
                <label class="search">
                    <span aria-hidden="true">⌕</span>
                    <input type="search" placeholder="Meklēt vēstnesī" />
                </label>
                <nav class="top-actions" aria-label="Galvenā navigācija">
                            <button class="icon-button" aria-label="Paziņojumi">
                        ♡
                    </button>
                    <button class="icon-button" aria-label="Ziņas">✉</button>
                    <button
                        class="avatar avatar-small"
                        aria-label="Atvērt profila izvēlni"
                    ></button>
                </nav>
            </div>
        </header>

        <main class="page-shell">
            <section class="profile-card" aria-labelledby="profileName">
                <div class="cover-photo"></div>
                <div class="profile-header">
                    <div class="profile-identity">
                        <div
                            class="avatar avatar-large"
                            id="profileAvatar"
                        ></div>
                        <div>
                            <p class="eyebrow"></p>
                            <h1 id="profileName"></h1>
                            <p class="muted" id="profileHandle"></p>
                        </div>
                    </div>
                    <div class="profile-actions"></div>
                </div>
                <nav class="profile-tabs" aria-label="Profila sadaļas">
                    <a class="active" href="#posts">Ieraksti</a>
                    <a href="#about">Par mani</a>
                    <a href="#photos">Fotoattēli</a>
                    <a href="#friends"
                        >Draugi <span id="friendCount"></span
                    ></a>
                </nav>
            </section>

            <div class="content-grid">
                <aside class="sidebar">
                    <section class="card intro-card" id="about">
                        <div class="section-heading">
                            <h2>Par korespondenti</h2>
                            <button class="text-button">Rediģēt</button>
                        </div>
                        <p class="bio" id="profileBio"></p>
                        <div class="detail-list">
                            <div>
                                <span class="detail-icon">◉</span
                                ><span id="profileBorn"></span>
                            </div>
                            <div>
                                <span class="detail-icon">⌂</span
                                ><span id="profileLocation"></span>
                            </div>
                            <div>
                                <span class="detail-icon">♡</span
                                ><span id="profileFamily"></span>
                            </div>
                            <div>
                                <span class="detail-icon">▣</span
                                ><span id="profileWork"></span>
                            </div>
                        </div>
                    </section>

                    <section class="card photos-card" id="photos">
                        <div class="section-heading">
                            <h2>Fotoattēli</h2>
                            <a class="text-button" href="#photos"
                                >Skatīt visus fotoattēlus</a
                            >
                        </div>
                        <div class="photo-grid" id="photoGrid"></div>
                    </section>
                </aside>

                <section class="feed" id="posts">
                    <section class="card composer">
                        <p class="eyebrow">Jaunākais izdevums</p>
                        <div class="composer-row">
                            <div
                                class="avatar avatar-medium"
                                id="composerAvatar"
                            ></div>
                            <div class="composer-input">
                                Par ko tu domā?
                            </div>
                        </div>
                        <div class="composer-actions">
                            <button class="composer-action" type="button">
                                ▣ <span>Fotoattēls/video</span>
                            </button>
                            <button class="composer-action" type="button">
                                ☺ <span>Sajūta/darbība</span>
                            </button>
                            <button class="composer-action" type="button">
                                ✦ <span>Dzīves notikums</span>
                            </button>
                        </div>
                    </section>
                    <div id="postList"></div>
                </section>
            </div>
        </main>

        <script src="content.js"></script>
        <script src="script.js"></script>
    </body>
</html>
